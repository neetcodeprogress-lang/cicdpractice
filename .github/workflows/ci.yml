# Display label for the Actions tab. Changing it does not break anything.
name: ci.yml

# Pull requests only. A PR build already tests the branch's newest commit, so
# the old [push, pull_request] pair ran the identical build twice per commit.
# workflow_dispatch adds a "Run workflow" button, which is handy for a demo.
on:
  pull_request:
  workflow_dispatch:

# Every job below runs on its own fresh runner. A runner starts empty, so a
# later job cannot see the target/ directory an earlier job produced. Anything
# a job needs from an earlier job has to travel as an uploaded artifact.
jobs:

  # ----------------------------------------------------------------------
  # GATE 1: the linter. No 'needs', so it starts at the same moment as
  # unit-tests. These two are the parallel pair on the run graph.
  # ----------------------------------------------------------------------
  lint:
    name: Lint (checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Checkstyle is bound to 'validate' in pom.xml. Every other job passes
      # -Dcheckstyle.skip=true so the lint result belongs to this job alone.
      - name: Run checkstyle
        run: mvn -B checkstyle:check

      # The XML is the evidence for a red X here, so upload it even on failure.
      - name: Upload the checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # The test suite. Also has no 'needs', so it runs beside lint.
  # A red X in this job is a failing test, never a style complaint.
  # ----------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Surefire runs the JUnit tests. Jacoco's agent records what the tests
      # touched and writes target/jacoco.exec.
      - name: Run the tests
        run: mvn -B -Dcheckstyle.skip=true test

      # jacoco.exec is the measurement. The coverage-gate job cannot recreate
      # it without running the suite again, so hand it over as an artifact.
      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: target/jacoco.exec

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # GATE 2: the coverage floor. 'needs: unit-tests' means this job waits for
  # the tests and is skipped if they fail. That wait is the first arrow on
  # the run graph.
  # ----------------------------------------------------------------------
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Put the measurement back where maven expects to find it.
      - name: Download the coverage data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec
          path: target

      # jacoco:check is bound to 'verify' and enforces jacoco.line.minimum
      # from pom.xml. -DskipTests means the classes are compiled but the suite
      # is not run twice; the gate reads the jacoco.exec downloaded above.
      - name: Enforce the coverage floor
        run: mvn -B -Dcheckstyle.skip=true -DskipTests verify

      # Prints the number on the run summary page, so nobody has to download a
      # report to see where the build landed against the floor.
      - name: Report coverage on the summary page
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {miss+=$8; cov+=$9} END {
              if (miss+cov > 0)
                printf "Line coverage: %.1f%% (%d of %d lines), floor is 80%%\n", 100*cov/(miss+cov), cov, miss+cov
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No jacoco report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # The jar. This is the "only when everything else passes" job.
  # 'needs' lists all three gates, and a job with 'needs' runs only after
  # every listed job succeeds. No 'if: always()' anywhere in this job, so a
  # red gate leaves this one marked "skipped" and no jar is produced.
  # ----------------------------------------------------------------------
  package:
    name: Package the jar
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, coverage-gate]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The gates already passed, so this step only assembles the jar.
      - name: Build the jar
        run: mvn -B -Dcheckstyle.skip=true -DskipTests package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
