# This is the name of the yml; display label for actions tab
# Note: Changing this won't break anything
name: continuous integration

# Pull requests only. A PR build already tests the branch's newest commit, so
# the old [push, pull_request] pair ran the identical build twice per commit.
# workflow_dispatch adds a "Run workflow" button, which is handy for a demo.
on:
  pull_request:
  workflow_dispatch:

# Container for all work; without this keyword nothing will execute, as
# a workflow needs at least one job
jobs:

  # Job ID. This name 'build' is a convention; it doesn't have to be named 'build'
  build:

    # GitHub uses a VM, and here we have that vm be ubuntu; latest version
    # Note: This is required, becuz otherwise GH doesn't know what to run it on
    runs-on: ubuntu-latest

    # The ordered list of things this job does. Every step is its own collapsible
    # line in the Actions tab, so one step per gate means the run page tells you
    # which gate failed before you open a single log.
    steps:

      # This allows runner to see the code. Without it, the machine is empty and
      # mvn has nothing to build
      - name: Check out the code
        uses: actions/checkout@v4

      # Add java version. 'cache: maven' reuses ~/.m2 across runs, so the four
      # mvn steps below do not re-download the same jars four times.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # GATE 1 from pom.xml. Checkstyle is bound to 'validate', which every mvn
      # phase below would trigger again; -Dcheckstyle.skip on those keeps the
      # lint result attached to this one step.
      - name: Lint (checkstyle)
        run: mvn -B checkstyle:check

      # Compile only. A red X here is a compiler error, never a test failure.
      - name: Compile
        run: mvn -B -Dcheckstyle.skip=true compile

      # Surefire runs the JUnit tests. Jacoco's 'report' execution is bound to
      # this same 'test' phase, so target/site/jacoco is written here too.
      - name: Run unit tests
        run: mvn -B -Dcheckstyle.skip=true test

      # GATE 2 from pom.xml: jacoco:check enforces jacoco.line.minimum at
      # 'verify'. -DskipTests reuses the target/jacoco.exec the previous step
      # just wrote instead of running the whole suite a second time.
      - name: Package and enforce the coverage gate
        run: mvn -B -Dcheckstyle.skip=true -DskipTests verify

      # Prints the coverage number on the run's summary page, so nobody has to
      # download a report to see where the build landed against the floor.
      - name: Report coverage on the summary page
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {miss+=$8; cov+=$9} END {
              if (miss+cov > 0)
                printf "Line coverage: %.1f%% (%d of %d lines), floor is 50%%\n", 100*cov/(miss+cov), cov, miss+cov
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No jacoco report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 'if: always()' so the reports still upload when a gate fails, which is
      # exactly when you want to read them.
      - name: Upload the reports and the jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            target/*.jar
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
